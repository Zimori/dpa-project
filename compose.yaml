# Taken from the TP project (spark-streaming-kafka):
#   kafka       single Kafka broker (KRaft mode, no ZooKeeper)
#   producer... (TODO)
#   jupyter     JupyterLab + PySpark 3.5.3 (local mode) + Kafka connector, runs Part 1 and Part 2
#
#   docker compose up -d --build     # start everything
#   docker compose down -v           # stop and delete all the data

services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    ports:
      - "9094:9094"            # access from the host: localhost:9094
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3                 # topics are auto-created with 3 partitions
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the topics in advance, so that Spark can subscribe to them
  # even before the first message is produced.
  kafka-init:
    image: apache/kafka:3.8.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in listens; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
    restart: "no"

  jupyter:
    build: ./jupyter
    container_name: jupyter
    ports:
      - "127.0.0.1:8889:8888"  # JupyterLab  -> http://localhost:8889 (8889 avoids a clash with a native install)
      - "127.0.0.1:4040:4040"  # Spark UI    -> http://localhost:4040 (while a session runs)
    volumes:
      - .:/workspace/work
    depends_on:
      kafka-init:
        condition: service_completed_successfully
